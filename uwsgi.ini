[uwsgi]
chdir = /home/vyralsyn/dev/ai_social/server
# Set the WSGI application module
module = ai_social.wsgi:application

# Number of worker processes (adjust based on server resources)
workers = 4

# Run as a daemon (background process)
# daemonize = log/uwsgi.log

# Bind to a network port (default 8000)
http = 127.0.0.1:8000

# Set master process
master = true

# Restart workers after serving 5000 requests (prevents memory leaks)
max-requests = 5000

# Allow serving static files (optional, if Django is handling them)
static-map = /static=static

# Enable threads
enable-threads = true

# Set buffer size (for handling large requests)
buffer-size = 32768

# Log errors
logto = log/uwsgi_error.log
